variables:
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project

stages:
  - mr-standards
  - static-tests
  - check-jenkins-status
  - notebook-testing


include:
  - project: 'nvidia-tao-toolkit/tao-utilities/tao-gitlab-templates'
    file:
      - 'check-mr-lines.yml'
      - 'validate-mr-title.yml'


validate_mr_title:
  stage: mr-standards
  tags: ["trigger-jenkins"]
  extends: .validate_mr_title

check_mr_lines:
  stage: mr-standards
  tags: ["trigger-jenkins"]
  extends: .check_mr_lines


static_tests:
  stage: static-tests
  image: nvcr.io/nvidia/pytorch:24.03-py3
  script:
    - pip install pylint==3.0.3 pydocstyle flake8
    - python3 ci/run_static_tests.py
  tags: ["trigger-jenkins"]
  only:
    refs:
      - merge_requests


check_jenkins_status:
  stage: check-jenkins-status
  script:
    - |
      curl_with_retry() {
          local max_attempts=5
          local wait=5
          local attempt=1
          while [ $attempt -le $max_attempts ]; do
              if response=$(curl --connect-timeout 30 --max-time 120 "$@" 2>/dev/null); then
                  echo "$response"
                  return 0
              fi
              if [ $attempt -lt $max_attempts ]; then
                  echo "WARNING: curl failed (attempt $attempt/$max_attempts), retrying in ${wait}s..." >&2
                  sleep $wait
                  wait=$((wait * 2))
              fi
              attempt=$((attempt + 1))
          done
          echo "ERROR: curl failed after $max_attempts attempts" >&2
          return 1
      }

      FORKED_REPO_URL=$CI_MERGE_REQUEST_SOURCE_PROJECT_URL
      SOURCE_BRANCH=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      TARGET_BRANCH=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME

      JENKINS_URL="https://prod.blsm.nvidia.com/metropolis-iva-tlt-jenkins"

      # Determine which Jenkins pipeline to trigger based on source/target branch names
      # Priority: dev/* -> default (develop)
      # Note: Release pipelines are NOT triggered during MRs, only on direct commits to release branches
      if [[ "$SOURCE_BRANCH" =~ ^dev/.* || "$TARGET_BRANCH" =~ ^dev/.* ]]; then
        echo "Dev branch detected (source='$SOURCE_BRANCH', target='$TARGET_BRANCH')"
        echo "Triggering tao-core-dev pipeline"
        JENKINS_JOB="tao-core-dev"
        BRANCH_TO_BUILD="$SOURCE_BRANCH"
        JENKINS_PARAMS="token=$JENKINS_JOB_TOKEN&GITLAB_REPO_URL=$FORKED_REPO_URL&GITLAB_BRANCH=$BRANCH_TO_BUILD"
      else
        echo "Defaulting to develop pipeline (source='$SOURCE_BRANCH', target='$TARGET_BRANCH')"
        JENKINS_JOB="tao-core-develop"
        BRANCH_TO_BUILD="$SOURCE_BRANCH"
        JENKINS_PARAMS="token=$JENKINS_JOB_TOKEN&GITLAB_REPO_URL=$FORKED_REPO_URL&GITLAB_BRANCH=$BRANCH_TO_BUILD"
      fi

      echo "Jenkins Job: $JENKINS_JOB"
      echo "Jenkins Parameters: $JENKINS_PARAMS"

      # Step 1: Fetch the last build number before triggering a new build
      last_build_number=$(curl_with_retry -s -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" \
          "$JENKINS_URL/job/$JENKINS_JOB/lastBuild/buildNumber") || {
          echo "ERROR: Failed to reach Jenkins API to fetch last build number"
          exit 1
      }
      if ! [[ "$last_build_number" =~ ^[0-9]+$ ]]; then
          echo "ERROR: Unexpected response for last build number: '$last_build_number'"
          exit 1
      fi
      echo "Last build number: $last_build_number"

      # Step 2: Trigger the new build
      curl_with_retry -s -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" \
          "$JENKINS_URL/view/tao-core/job/$JENKINS_JOB/buildWithParameters?$JENKINS_PARAMS" || {
          echo "ERROR: Failed to trigger Jenkins build after retries"
          exit 1
      }
      echo "Jenkins build triggered successfully"

      # Step 3: Poll until a new build number is detected (with timeout)
      MAX_POLL_WAIT=300
      poll_start=$(date +%s)
      consecutive_failures=0
      while true; do
          current_build_number=$(curl_with_retry -s -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" \
              "$JENKINS_URL/job/$JENKINS_JOB/lastBuild/buildNumber" 2>/dev/null) || true

          if [[ "$current_build_number" =~ ^[0-9]+$ ]] && [ "$current_build_number" -gt "$last_build_number" ]; then
              echo "New build detected: Build Number $current_build_number"
              break
          fi

          if ! [[ "$current_build_number" =~ ^[0-9]+$ ]]; then
              consecutive_failures=$((consecutive_failures + 1))
              echo "WARNING: Failed to poll build number (consecutive failures: $consecutive_failures)"
              if [ $consecutive_failures -ge 3 ]; then
                  echo "ERROR: Cannot reach Jenkins API after $consecutive_failures consecutive polling failures"
                  exit 1
              fi
          else
              consecutive_failures=0
          fi

          elapsed=$(($(date +%s) - poll_start))
          if [ $elapsed -gt $MAX_POLL_WAIT ]; then
              echo "ERROR: Timed out waiting for new Jenkins build (${MAX_POLL_WAIT}s elapsed)"
              exit 1
          fi

          sleep 1
      done

      build_url="$JENKINS_URL/job/$JENKINS_JOB/${current_build_number}/"
      echo "You can view the build details at: $build_url"

      # Step 4: Poll Jenkins job status and stream console output
      # Reference:
      # - https://stackoverflow.com/a/64660976
      # - https://prod.blsm.nvidia.com/metropolis-iva-tlt-jenkins/api/
      echo "---------- Console Output of the Jenkins job ----------"
      start=0
      consecutive_failures=0
      MAX_CONSECUTIVE_FAILURES=30
      while true; do
          response=$(curl -si --connect-timeout 30 --max-time 120 \
              -w "\n%{size_header},%{size_download}" \
              -u "$JENKINS_USER:$JENKINS_TOKEN" \
              "$JENKINS_URL/job/$JENKINS_JOB/${current_build_number}/logText/progressiveText?start=${start}" 2>/dev/null) || true

          job_status=$(curl -s --connect-timeout 30 --max-time 60 \
              -u "$JENKINS_USER:$JENKINS_TOKEN" \
              "$JENKINS_URL/job/$JENKINS_JOB/${current_build_number}/api/json?tree=result" 2>/dev/null | \
              jq -r '.result' 2>/dev/null) || true

          # If both API calls failed, track consecutive failures
          if [ -z "$response" ] && { [ -z "$job_status" ] || [ "$job_status" = "null" ]; }; then
              consecutive_failures=$((consecutive_failures + 1))
              echo "WARNING: Jenkins API unreachable (consecutive failures: $consecutive_failures/$MAX_CONSECUTIVE_FAILURES)"
              if [ $consecutive_failures -ge $MAX_CONSECUTIVE_FAILURES ]; then
                  echo "ERROR: Lost connection to Jenkins after $consecutive_failures consecutive failures (~$((consecutive_failures * 10))s)"
                  echo "Jenkins build may still be running at: $build_url"
                  exit 1
              fi
              sleep 10
              continue
          fi
          consecutive_failures=0

          # Parse and display console output when available
          if [ -n "$response" ]; then
              header_size=$(sed -n '$ s/^\([0-9]*\),.*$/\1/ p' <<< "${response}") || true
              body_size=$(sed -n '$ s/^.*,\([0-9]*\)$/\1/ p' <<< "${response}") || true
              if [ -n "$header_size" ] && [ -n "$body_size" ]; then
                  header="${response:0:${header_size}}"
                  body="$(sed '$d' <<< ${response:${header_size}:${body_size}})"
                  # Extract the next start offset from the X-Text-Size response
                  # header. Use case-insensitive grep because HTTP/2 (and some
                  # reverse proxies) lowercase header names. If the header is
                  # still missing or unparseable, fall back to advancing by the
                  # body bytes we actually received so we don't re-stream the
                  # same log range on every poll.
                  new_start=$(echo "$header" | grep -i "X-Text-Size" | sed "s/[^0-9]//g" || true)
                  if [ -n "$new_start" ]; then
                      start="$new_start"
                  else
                      start=$((start + ${#body}))
                  fi
                  echo "$body"
              fi
          fi

          if [ "$job_status" == "SUCCESS" ]; then
              echo "-------------- End of the Console Output --------------"
              echo "Jenkins job succeeded"
              break
          elif [ "$job_status" == "UNSTABLE" ]; then
              echo "-------------- End of the Console Output --------------"
              echo "Jenkins job is UNSTABLE"
              break
          elif [ "$job_status" == "FAILURE" ]; then
              echo "-------------- End of the Console Output --------------"
              echo "Jenkins job failed"
              exit 1
          elif [ "$job_status" == "ABORTED" ]; then
              echo "Jenkins job was aborted"
              exit 1
          else
              sleep 10
          fi
      done

  timeout: 5h
  tags: ["trigger-jenkins"]
  only:
    refs:
      - merge_requests


trigger_notebook_testing:
  stage: notebook-testing
  script:
    - |
      curl_with_retry() {
          local max_attempts=5
          local wait=5
          local attempt=1
          while [ $attempt -le $max_attempts ]; do
              if response=$(curl --connect-timeout 30 --max-time 120 "$@" 2>/dev/null); then
                  echo "$response"
                  return 0
              fi
              if [ $attempt -lt $max_attempts ]; then
                  echo "WARNING: curl failed (attempt $attempt/$max_attempts), retrying in ${wait}s..." >&2
                  sleep $wait
                  wait=$((wait * 2))
              fi
              attempt=$((attempt + 1))
          done
          echo "ERROR: curl failed after $max_attempts attempts" >&2
          return 1
      }

      BRANCH_NAME=$CI_COMMIT_BRANCH

      JENKINS_URL="https://prod.blsm.nvidia.com/metropolis-iva-tlt-jenkins"
      JENKINS_JOB="notebook-testing-release"
      JENKINS_PARAMS="token=$JENKINS_JOB_TOKEN&BRANCH_NAME=$BRANCH_NAME"

      echo "Triggering notebook-testing-release pipeline for branch: $BRANCH_NAME"

      # Step 1: Fetch the last build number before triggering a new build
      last_build_number=$(curl_with_retry -s -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" \
          "$JENKINS_URL/job/$JENKINS_JOB/lastBuild/buildNumber") || {
          echo "ERROR: Failed to reach Jenkins API to fetch last build number"
          exit 1
