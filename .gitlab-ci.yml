              if [ $consecutive_failures -ge 3 ]; then
                  echo "ERROR: Cannot reach Jenkins API after $consecutive_failures consecutive polling failures"
                  exit 1
              fi
          else
              consecutive_failures=0
          fi

          elapsed=$(($(date +%s) - poll_start))
          if [ $elapsed -gt $MAX_POLL_WAIT ]; then
              echo "ERROR: Timed out waiting for new Jenkins build (${MAX_POLL_WAIT}s elapsed)"
              exit 1
          fi

          sleep 1
      done

      build_url="$JENKINS_URL/view/notebook-testing/job/$JENKINS_JOB/${current_build_number}/"
      echo "You can view the build details at: $build_url"

      # Step 4: Poll Jenkins job status and stream console output
      echo "---------- Console Output of the Jenkins job ----------"
      start=0
      consecutive_failures=0
      MAX_CONSECUTIVE_FAILURES=30
      while true; do
          response=$(curl -si --connect-timeout 30 --max-time 120 \
              -w "\n%{size_header},%{size_download}" \
              -u "$JENKINS_USER:$JENKINS_TOKEN" \
              "$JENKINS_URL/job/$JENKINS_JOB/${current_build_number}/logText/progressiveText?start=${start}" 2>/dev/null) || true

          job_status=$(curl -s --connect-timeout 30 --max-time 60 \
              -u "$JENKINS_USER:$JENKINS_TOKEN" \
              "$JENKINS_URL/job/$JENKINS_JOB/${current_build_number}/api/json?tree=result" 2>/dev/null | \
              jq -r '.result' 2>/dev/null) || true

          # If both API calls failed, track consecutive failures
          if [ -z "$response" ] && { [ -z "$job_status" ] || [ "$job_status" = "null" ]; }; then
              consecutive_failures=$((consecutive_failures + 1))
              echo "WARNING: Jenkins API unreachable (consecutive failures: $consecutive_failures/$MAX_CONSECUTIVE_FAILURES)"
              if [ $consecutive_failures -ge $MAX_CONSECUTIVE_FAILURES ]; then
                  echo "ERROR: Lost connection to Jenkins after $consecutive_failures consecutive failures (~$((consecutive_failures * 10))s)"
                  echo "Jenkins build may still be running at: $build_url"
                  exit 1
              fi
              sleep 10
              continue
          fi
          consecutive_failures=0

          # Parse and display console output when available
          if [ -n "$response" ]; then
              header_size=$(sed -n '$ s/^\([0-9]*\),.*$/\1/ p' <<< "${response}") || true
              body_size=$(sed -n '$ s/^.*,\([0-9]*\)$/\1/ p' <<< "${response}") || true
