variables:
  GIT_DEPTH: "0"  # Tells git to fetch all the branches of the project

stages:
  - mr-standards
  - static-tests
  - check-jenkins-status


include:
  - project: 'nvidia-tao-toolkit/tao-utilities/tao-gitlab-templates'
    file:
      - 'check-mr-lines.yml'
      - 'validate-mr-title.yml'


validate_mr_title:
  stage: mr-standards
  tags: ["trigger-jenkins"]
  extends: .validate_mr_title

check_mr_lines:
  stage: mr-standards
  tags: ["trigger-jenkins"]
  extends: .check_mr_lines


static_tests:
  stage: static-tests
  image: nvcr.io/nvidia/pytorch:24.03-py3
  script:
    - pip install pylint==3.0.3 pydocstyle flake8
    - python3 ci/run_static_tests.py
  tags: ["trigger-jenkins"]
  only:
    refs:
      - merge_requests


check_jenkins_status:
  stage: check-jenkins-status
  script:
    - |
      # Define Jenkins parameters
      FORKED_REPO_URL=$CI_MERGE_REQUEST_SOURCE_PROJECT_URL
      SOURCE_BRANCH=$CI_MERGE_REQUEST_SOURCE_BRANCH_NAME
      TARGET_BRANCH=$CI_MERGE_REQUEST_TARGET_BRANCH_NAME

      JENKINS_URL="https://prod.blsm.nvidia.com/metropolis-iva-tlt-jenkins"
      
      # Determine which Jenkins pipeline to trigger based on source/target branch names
      # Priority: dev/* -> default (develop)
      # Note: Release pipelines are NOT triggered during MRs, only on direct commits to release branches
      if [[ "$SOURCE_BRANCH" =~ ^dev/.* || "$TARGET_BRANCH" =~ ^dev/.* ]]; then
        echo "Dev branch detected (source='$SOURCE_BRANCH', target='$TARGET_BRANCH')"
        echo "Triggering tao-core-dev pipeline"
        JENKINS_JOB="tao-core-dev"
        BRANCH_TO_BUILD="$SOURCE_BRANCH"
        JENKINS_PARAMS="token=$JENKINS_JOB_TOKEN&GITLAB_REPO_URL=$FORKED_REPO_URL&GITLAB_BRANCH=$BRANCH_TO_BUILD"
      else
        echo "Defaulting to develop pipeline (source='$SOURCE_BRANCH', target='$TARGET_BRANCH')"
        JENKINS_JOB="tao-core-develop"
        BRANCH_TO_BUILD="$SOURCE_BRANCH"
        JENKINS_PARAMS="token=$JENKINS_JOB_TOKEN&GITLAB_REPO_URL=$FORKED_REPO_URL&GITLAB_BRANCH=$BRANCH_TO_BUILD"
      fi
      
      echo "Jenkins Job: $JENKINS_JOB"
      echo "Jenkins Parameters: $JENKINS_PARAMS"
      
      # Step 1: Fetch the last build number before triggering a new build
      last_build_number=$(curl -s -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" "$JENKINS_URL/job/$JENKINS_JOB/lastBuild/buildNumber")

      # Step 2: Trigger the new build
      curl -s -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" \
      "$JENKINS_URL/view/tao-core/job/$JENKINS_JOB/buildWithParameters?$JENKINS_PARAMS"

      # Step 3: Poll until a new build number is detected
      while true; do
          current_build_number=$(curl -s -X POST -u "$JENKINS_USER:$JENKINS_TOKEN" "$JENKINS_URL/job/$JENKINS_JOB/lastBuild/buildNumber")
          
          if [ "$current_build_number" -gt "$last_build_number" ]; then
              echo "New build detected: Build Number $current_build_number"
              break
          fi

          sleep 1
      done

      build_url="$JENKINS_URL/job/$JENKINS_JOB/${current_build_number}/"
      echo "You can view the build details at: $build_url"

      # Step 4 : Poll Jenkins job status and get details for each stage
      # Reference:
      # - https://stackoverflow.com/a/64660976
      # - https://prod.blsm.nvidia.com/metropolis-iva-tlt-jenkins/api/
      echo "---------- Console Output of the Jenkins job ----------"
      start=0
      while true; do
          # Fetch the Console Output of the job
          response=$(curl -si -w "\n%{size_header},%{size_download}" -u "$JENKINS_USER:$JENKINS_TOKEN" \
          "$JENKINS_URL/job/$JENKINS_JOB/${current_build_number}/logText/progressiveText?start=${start}")

          # Extract the header and the body
          header_size=$(sed -n '$ s/^\([0-9]*\),.*$/\1/ p' <<< "${response}")
          body_size=$(sed -n '$ s/^.*,\([0-9]*\)$/\1/ p' <<< "${response}")
          header="${response:0:${header_size}}"
          body="$(sed '$d' <<< ${response:${header_size}:${body_size}})"

          # Extract the start value by from the header
          start=$(echo "$header" | grep "X-Text-Size" | sed "s/[^0-9]//g")

          # Fetch the job status (SUCCESS, FAILURE, ABORTED, etc.)
          # Use `|| true` to prevent the script from failing if `jq` encounters an error.
          job_status=$(curl -s -u "$JENKINS_USER:$JENKINS_TOKEN" \
          "$JENKINS_URL/job/$JENKINS_JOB/${current_build_number}/api/json?tree=result" | \
          jq -r '.result') || true

          # Output the log
          echo "$body"

          # Handle the overall job status
          if [ "$job_status" == "SUCCESS" ]; then
              echo "-------------- End of the Console Output --------------"
              echo "Jenkins job succeeded"
              break
          elif [ "$job_status" == "UNSTABLE" ]; then
              echo "-------------- End of the Console Output --------------"
              echo "Jenkins job is UNSTABLE"
              break
          elif [ "$job_status" == "FAILURE" ]; then
              echo "-------------- End of the Console Output --------------"
              echo "Jenkins job failed"
              exit 1
          elif [ "$job_status" == "ABORTED" ]; then
              echo "Jenkins job was aborted"
              exit 1
          else
              sleep 10
          fi
      done

  timeout: 2h
  tags: ["trigger-jenkins"]
  only:
    refs:
      - merge_requests

